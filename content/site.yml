skills:
  - title: Accessibility
    body: >-
      Semantic HTML, keyboard and screen reader support, built to WCAG
      guidelines. Led site-wide accessibility improvements at Nurole.
  - title: Testing and CI/CD
    body: >-
      Unit and integration testing with automated pipelines. Introduced both
      at Preoptima, so every change is checked before release.
  - title: Design systems
    body: >-
      Reusable Vue component libraries that keep large products consistent.
      Built Nurole's shared component library.
  - title: Mentoring
    body: >-
      A year coaching bootcamp students at Flatiron School. Comfortable
      explaining technical decisions to developers and non-developers.


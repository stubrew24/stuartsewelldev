[build]
  command = "npm run generate"
  # Nuxt is pinned to its plain static preset (see nuxt.config.ts).
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"

# Everything under /_nuxt is content-hashed (the app manifest is disabled in
# nuxt.config.ts), so it can be cached for a year.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Source images and their generated sizes keep their names when an image is
# replaced, so cache for a week rather than forever.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/_ipx/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

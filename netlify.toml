[build]
  command = "npm run generate"
  # On Netlify, Nuxt builds with the netlify-static preset, which writes to dist/.
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Hashed build assets (JS, CSS, fonts) never change: cache for a year.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Source images keep their names when replaced, so cache for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

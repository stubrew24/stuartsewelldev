[build]
  command = "npm run generate"
  # Nuxt is pinned to its plain static preset (see nuxt.config.ts).
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"

# Cache headers, matching what Nuxt's Netlify preset would generate.
# Hashed JS, CSS and fonts never change; the build manifest must stay fresh.
[[headers]]
  for = "/_nuxt/builds/meta/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/builds/*"
  [headers.values]
    Cache-Control = "public, max-age=1, immutable"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Source images and their generated sizes keep their names when an image is
# replaced, so cache for a week rather than forever.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/_ipx/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
